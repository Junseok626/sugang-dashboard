<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수강신청 비교 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand__logo" aria-hidden="true"></div>
        <h1 class="brand__title">수강신청 비교 대시보드</h1>
      </div>

      <nav class="header-tabs" aria-label="주요 메뉴">
        <a class="header-tabs__link" href="#timetable">내 시간표</a>
        <a class="header-tabs__link" href="#search">과목 찾기</a>
      </nav>

      <div class="meta">
        <select id="meta-semester" class="semester-select" aria-label="조회 학기 선택" aria-describedby="semester-message" disabled>
          <option value="">학기 정보를 불러오는 중…</option>
        </select>
        <span id="semester-message" class="semester-message" role="status" hidden></span>
        <span class="meta__badge" id="meta-updated" hidden></span>
        <button class="btn-add" id="meta-retry" type="button" hidden>다시 시도</button>
      </div>
    </header>
    <section id="tab-timetable" aria-label="내 시간표" hidden>
      <div class="body timetable-page">
        <div class="timetable-card">
          <div class="timetable-card__header">
            <div>
              <h2 class="timetable-card__title">내 시간표</h2>
              <p class="timetable-card__summary" id="timetable-summary" role="status"></p>
            </div>
            <a class="timetable-action" href="#search">+ 과목 추가</a>
          </div>

          <div class="timetable-status" id="timetable-status" role="alert" hidden>
            <p id="timetable-error"></p>
            <button class="btn-add" id="timetable-retry" type="button">다시 시도</button>
          </div>

          <div class="week-grid">
            <div class="week-grid__cells" id="week-grid-cells"></div>
            <div id="week-grid-blocks"></div>
            <div class="timetable-empty" id="timetable-empty" hidden>
              <div class="timetable-empty__icon" aria-hidden="true"></div>
              <h3>아직 담은 과목이 없어요</h3>
              <p>과목을 찾아 시간표에 넣어보세요</p>
              <a class="timetable-action" href="#search">과목 찾아보기</a>
            </div>
          </div>
        </div>

        <aside class="timetable-panel" aria-label="담은 과목">
          <h2 id="timetable-cart-title"></h2>
          <ul class="cart-list" id="timetable-cart-list"></ul>
          <div class="timetable-total">
            <span>총 학점</span>
            <strong id="timetable-total"></strong>
          </div>
        </aside>
      </div>
    </section>

    <section id="tab-search" aria-label="과목 찾기" hidden>
      <div class="body">
        <aside class="filters" aria-label="필터">
          <fieldset class="filter-group filter-group--tight">
            <legend class="filter-group__title">이수구분</legend>
            <label class="checkbox"><input type="checkbox" name="category" value="전공기초">전공기초</label>
            <label class="checkbox"><input type="checkbox" name="category" value="전공핵심">전공핵심</label>
            <label class="checkbox"><input type="checkbox" name="category" value="전공심화">전공심화</label>
            <label class="checkbox"><input type="checkbox" name="category" value="교양선택">교양선택</label>
            <label class="checkbox"><input type="checkbox" name="category" value="교양필수">교양필수</label>
          </fieldset>

          <fieldset class="filter-group">
            <legend class="filter-group__title">요일</legend>
            <div class="days" id="day-chips">
              <button class="day-chip" type="button" data-day="월" aria-pressed="false">월</button>
              <button class="day-chip" type="button" data-day="화" aria-pressed="false">화</button>
              <button class="day-chip" type="button" data-day="수" aria-pressed="false">수</button>
              <button class="day-chip" type="button" data-day="목" aria-pressed="false">목</button>
              <button class="day-chip" type="button" data-day="금" aria-pressed="false">금</button>
              <button class="day-chip" type="button" data-day="토" aria-pressed="false">토</button>

            </div>
          </fieldset>

          <div class="filter-group">
            <label class="filter-group__title" for="credit-filter">학점</label>
            <div class="select">
              <select id="credit-filter">
                <option value="">전체</option>
                <option value="1">1학점</option>
                <option value="2">2학점</option>
                <option value="3">3학점</option>
              </select>
              <img class="select__chevron" src="css/icon-chevron.svg" width="11.0607" height="6.59099" alt="">
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-group__title" for="rating-filter">최소 평점</label>
            <div class="select">
              <select id="rating-filter">
                <option value="">전체</option>
                <option value="3">3.0 이상</option>
                <option value="3.5">3.5 이상</option>
                <option value="4">4.0 이상</option>
                <option value="4.5">4.5 이상</option>
              </select>
              <img class="select__chevron" src="css/icon-chevron.svg" width="11.0607" height="6.59099" alt="">
            </div>
          </div>
        </aside>

        <main class="results">
          <form class="search" id="search-form" role="search">
            <input class="search__input" id="search-input" type="search" placeholder="과목명, 교수명으로 검색" aria-label="과목명, 교수명으로 검색">
            <button class="search__button" type="submit">검색</button>
          </form>
          <p class="results__count" id="result-count" role="status"></p>
          <div class="course-table" role="table" aria-label="검색 결과">
            <div class="course-table__head" role="row">
              <span role="columnheader">과목명</span>
              <span role="columnheader">교수</span>
              <span role="columnheader">시간</span>
              <span role="columnheader">학점</span>
              <span role="columnheader">평점</span>
              <span role="columnheader" aria-label="담기"></span>
            </div>
            <div id="course-rows"></div>
          </div>
        </main>

        <aside class="my-timetable" aria-label="내 시간표">
          <h2 class="my-timetable__title" id="cart-title"></h2>
          <div class="mini-grid" id="mini-grid"></div>
          <ul class="cart-list" id="cart-list"></ul>
          <div class="toast" id="conflict-toast" role="status" hidden>
            <span class="toast__icon"><img src="css/icon-warning.svg" width="10.3923" height="8.25" alt=""></span>
            <p class="toast__message" id="conflict-message"></p>
          </div>
        </aside>
      </div>
    </section>
  </div>

  <dialog id="detail-modal" class="detail-modal" aria-labelledby="detail-title">
    <header class="detail-header">
      <button type="button" id="detail-close" class="detail-close" aria-label="상세 닫기">×</button>
      <h2 id="detail-title">과목 상세</h2>
      <p id="detail-code" hidden></p>
      <div id="detail-tags" class="detail-tags" hidden>
        <span id="detail-category"></span><span id="detail-credit"></span><span id="detail-rating"></span>
      </div>
    </header>
    <div class="detail-body">
      <p id="detail-error" class="detail-error" role="alert" hidden></p>
      <button type="button" id="detail-retry" class="detail-button" hidden>다시 불러오기</button>
      <p id="detail-notice" class="detail-notice" role="status"></p>
      <div id="detail-content" hidden>
        <section class="detail-section" aria-labelledby="detail-info-heading">
          <h3 id="detail-info-heading">개설 정보</h3>
          <dl class="detail-info">
            <div><dt>교수</dt><dd id="detail-professor"></dd></div>
            <div><dt>학기</dt><dd id="detail-semester"></dd></div>
            <div><dt>시간</dt><dd id="detail-time"></dd></div>
            <div><dt>강의실</dt><dd id="detail-room"></dd></div>
          </dl>
        </section>
        <section class="detail-section" aria-labelledby="detail-review-count">
          <div class="detail-review-heading"><h3 id="detail-review-count">강의평</h3><button type="button" id="detail-write" class="detail-link">강의평 쓰기</button></div>
          <form id="review-form" class="review-form" hidden novalidate>
            <fieldset id="review-fields">
              <legend>강의평 작성</legend>
              <div class="review-stars" role="group" aria-label="별점 (0.5점 단위)">
                <span class="review-star" data-star="1">
                  <span class="review-star__icon" aria-hidden="true">★</span>
                  <button type="button" class="review-star__half" data-rating="0.5" aria-label="0.5점" aria-pressed="false"></button>
                  <button type="button" class="review-star__half review-star__half--right" data-rating="1" aria-label="1점" aria-pressed="false"></button>
                </span>
                <span class="review-star" data-star="2">
                  <span class="review-star__icon" aria-hidden="true">★</span>
                  <button type="button" class="review-star__half" data-rating="1.5" aria-label="1.5점" aria-pressed="false"></button>
                  <button type="button" class="review-star__half review-star__half--right" data-rating="2" aria-label="2점" aria-pressed="false"></button>
                </span>
                <span class="review-star" data-star="3">
                  <span class="review-star__icon" aria-hidden="true">★</span>
                  <button type="button" class="review-star__half" data-rating="2.5" aria-label="2.5점" aria-pressed="false"></button>
                  <button type="button" class="review-star__half review-star__half--right" data-rating="3" aria-label="3점" aria-pressed="false"></button>
                </span>
                <span class="review-star" data-star="4">
                  <span class="review-star__icon" aria-hidden="true">★</span>
                  <button type="button" class="review-star__half" data-rating="3.5" aria-label="3.5점" aria-pressed="false"></button>
                  <button type="button" class="review-star__half review-star__half--right" data-rating="4" aria-label="4점" aria-pressed="false"></button>
                </span>
                <span class="review-star" data-star="5">
                  <span class="review-star__icon" aria-hidden="true">★</span>
                  <button type="button" class="review-star__half" data-rating="4.5" aria-label="4.5점" aria-pressed="false"></button>
                  <button type="button" class="review-star__half review-star__half--right" data-rating="5" aria-label="5점" aria-pressed="false"></button>
                </span>
              </div>
              <p id="review-rating-value" aria-live="polite">별점을 선택해 주세요.</p>
              <label for="review-semester">수강 학기</label><select id="review-semester" required></select>
              <label for="review-comment">강의평 (5~500자)</label>
              <textarea id="review-comment" rows="4" required aria-describedby="review-length review-error"></textarea>
              <p id="review-length">0 / 500자</p>
            </fieldset>
            <p id="review-meta-error" class="detail-error" role="alert"></p>
            <button type="button" id="review-meta-retry" class="detail-button" hidden>학기 다시 불러오기</button>
            <p id="review-error" class="detail-error" role="alert"></p>
            <div class="review-actions"><button type="button" id="review-cancel" class="detail-button">취소</button><button type="submit" id="review-submit" class="detail-button detail-button--primary">등록</button></div>
          </form>
          <div id="detail-reviews"></div>
        </section>
      </div>
    </div>
    <footer class="detail-footer"><button type="button" id="detail-cart" class="detail-button detail-button--primary">시간표에 넣기</button><button type="button" id="detail-close-bottom" class="detail-button">닫기</button></footer>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/timetable.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
